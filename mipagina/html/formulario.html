<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INICIO SESIÓN</title>
    <link rel="stylesheet" href="../css/formulario.css">
</head>
<body>
    <div class="flex-container">
        <!--ZONA BLANCA-->
        <div class="blanco">
            <i class="fas fa-dumbbell"></i> 
            <div class="titulo1">
                ADÉNTRATE
            </div> 
            <div class="subtitulo1">
                ¿Es tú primera vez? <a href="#">Registrarse</a>
            </div>
            <div class="formulario">
                <label for="nombre">Nombre y Apellidos:</label>
                <input class="control" for="text" name="nombre" required>
                <label for="email">Email:</label>
                <input class="control" type="text " name="email" required />
                <label for="contraseña">Contraseña:</label>
                <input class="control" type="text" name="contraseña"required>
            </div>
            <div class="contraseña">
                <a href="#">¿Has olvidado la contraseña?</a>
            </div>
            <button type="submit" class="iniciar-sesion">Iniciar sesión</button>        
        </div>
        <!--ZONA NEGRA-->
        <div class="negro">
            <div class="titulo2">
                <h2>Disfrutar y aprender a entrenar, si<br>se puede: corre y únete a nosotros.</h2>
            </div>
            <div class="subtitulo2">
                Cursos y rutinas de entrenadores profesionales.
            </div>
            <div class="fondo-imagen">
                <img src="imagenes/g1.jpg" alt="analisis" width="500px" height="353px" style="border-radius: 15px;"/>  
            </div>
        </div>
    </div>
    <script src="https://kit.fontawesome.com/bfcaa321b8.js" crossorigin="anonymous"></script>
</body>
</html>
